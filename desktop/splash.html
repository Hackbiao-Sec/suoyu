<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>天鉴·索舆</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        height: 100%; margin: 0; background: #05090e; overflow: hidden;
        color: #77909f;
        font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
        user-select: none; -webkit-user-select: none;
      }

      /* 舞台：暗底 + 极淡网格 + 中心径向光，5 秒里一直是这一套视觉 */
      .stage {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background:
          radial-gradient(circle at 50% 42%, rgba(20, 74, 78, 0.34), transparent 58%),
          radial-gradient(circle at 50% 120%, rgba(12, 40, 52, 0.5), transparent 62%),
          #05090e;
        transition: opacity 0.42s ease, transform 0.42s ease;
      }
      .grid {
        position: absolute; inset: -10%;
        background-image:
          linear-gradient(rgba(52, 229, 200, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(52, 229, 200, 0.045) 1px, transparent 1px);
        background-size: 46px 46px;
        mask-image: radial-gradient(circle at 50% 44%, #000 8%, transparent 66%);
        -webkit-mask-image: radial-gradient(circle at 50% 44%, #000 8%, transparent 66%);
        animation: gridIn 2.4s ease both;
      }
      @keyframes gridIn { from { opacity: 0; } to { opacity: 1; } }

      .stage.out { opacity: 0; transform: scale(1.035); }
      .stage.out .grid { opacity: 0; }

      /* 四角 HUD 括号 */
      .hud {
        position: absolute; width: 26px; height: 26px;
        border: 1px solid rgba(52, 229, 200, 0.3);
        opacity: 0; animation: hudIn 0.8s ease 0.5s both;
      }
      .hud.tl { top: 30px; left: 34px; border-right: 0; border-bottom: 0; }
      .hud.tr { top: 30px; right: 34px; border-left: 0; border-bottom: 0; }
      .hud.bl { bottom: 30px; left: 34px; border-right: 0; border-top: 0; }
      .hud.br { bottom: 30px; right: 34px; border-left: 0; border-top: 0; }
      @keyframes hudIn { from { opacity: 0; } to { opacity: 1; } }

      .core {
        position: relative; display: flex; flex-direction: column;
        align-items: center; gap: 0;
      }

      /* 雷达徽记 */
      .radar { width: 208px; height: 208px; display: block; }
      .radar .rim { opacity: 0; animation: fadeIn 0.7s ease 0.15s both; }
      .radar .arc { opacity: 0; animation: fadeIn 0.5s ease 0.8s both; }
      .arc-g {
        transform-box: view-box; transform-origin: 120px 120px;
        animation: spin 3.6s linear infinite;
      }
      .radar .inner { animation: innerIn 1.1s ease 0.55s both; }
      .inner-g {
        transform-box: view-box; transform-origin: 120px 120px;
        animation: spinBack 26s linear infinite;
      }
      .sweep-g {
        transform-box: view-box; transform-origin: 120px 120px;
        opacity: 0;
        animation: spin 2.6s linear infinite, fadeIn 0.9s ease 0.9s both;
      }
      .cross { opacity: 0; animation: fadeIn 0.8s ease 0.7s both; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spinBack { to { transform: rotate(-360deg); } }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes innerIn {
        from { opacity: 0; stroke-dashoffset: 26; }
        to { opacity: 1; stroke-dashoffset: 0; }
      }

      /* 目标光点：依次亮起再常亮呼吸 */
      .blip {
        transform-box: fill-box; transform-origin: center;
        animation: blipIn 0.55s cubic-bezier(0.2, 1.4, 0.5, 1) both;
      }
      .blip.b1 { animation-delay: 1.15s; }
      .blip.b2 { animation-delay: 1.45s; }
      .blip.b3 { animation-delay: 1.7s; }
      @keyframes blipIn {
        from { opacity: 0; transform: scale(0.2); }
        to { opacity: 1; transform: scale(1); }
      }
      .blip .halo {
        transform-box: fill-box; transform-origin: center;
        animation: halo 2.4s ease-in-out infinite;
      }
      @keyframes halo {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.28); }
      }

      /* 中心六边核心 */
      .hex {
        transform-box: fill-box; transform-origin: center;
        animation: hexIn 0.7s cubic-bezier(0.22, 1.3, 0.4, 1) 0.6s both;
      }
      @keyframes hexIn {
        from { opacity: 0; transform: scale(0.4); }
        to { opacity: 1; transform: scale(1); }
      }
      .pulse-g { transform-box: view-box; transform-origin: 120px 120px; }
      .pulse-g circle {
        animation: pulse 2.8s ease-out infinite;
        opacity: 0;
      }
      .pulse-g circle:nth-child(2) { animation-delay: 0.9s; }
      @keyframes pulse {
        0% { r: 10; opacity: 0.55; }
        100% { r: 46; opacity: 0; }
      }

      /* 品牌字 */
      .brand {
        position: relative; margin-top: 22px; display: flex; align-items: baseline;
        font-size: 27px; font-weight: 700; letter-spacing: 6px; color: #dceef6;
      }
      .brand span {
        display: inline-block; opacity: 0;
        animation: rise 0.55s cubic-bezier(0.2, 0.9, 0.3, 1) both;
      }
      .brand span:nth-child(1) { animation-delay: 0.55s; }
      .brand span:nth-child(2) { animation-delay: 0.68s; }
      .brand span:nth-child(3) { animation-delay: 0.81s; }
      .brand span:nth-child(4) { animation-delay: 0.94s; color: #34e5c8; }
      .brand span:nth-child(5) { animation-delay: 1.07s; color: #34e5c8; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(9px); }
        to { opacity: 1; transform: translateY(0); }
      }
      /* 一道高光扫过品牌字 */
      .brand::after {
        content: ""; position: absolute; inset: -6px -10px; pointer-events: none;
        background: linear-gradient(100deg, transparent 34%, rgba(180, 255, 245, 0.42) 50%, transparent 66%);
        transform: translateX(-130%);
        animation: sheen 1.25s ease-in-out 1.55s both;
      }
      @keyframes sheen {
        from { transform: translateX(-130%); opacity: 0; }
        18% { opacity: 1; }
        to { transform: translateX(130%); opacity: 0; }
      }

      .sub {
        margin-top: 11px; font-size: 11px; letter-spacing: 5px; color: #4d6f7e;
        opacity: 0; animation: subIn 1s ease 1.35s both;
      }
      @keyframes subIn {
        from { opacity: 0; letter-spacing: 9px; }
        to { opacity: 1; letter-spacing: 5px; }
      }

      /* 进度条 */
      .bar {
        position: relative; width: 268px; height: 2px; margin-top: 30px;
        background: rgba(52, 229, 200, 0.12); border-radius: 2px; overflow: hidden;
        opacity: 0; animation: fadeIn 0.6s ease 0.9s both;
      }
      .bar i {
        position: absolute; left: 0; top: 0; bottom: 0; width: 0;
        background: linear-gradient(90deg, rgba(52, 229, 200, 0.35), #34e5c8);
        box-shadow: 0 0 12px rgba(52, 229, 200, 0.7);
        transition: width 0.16s linear;
      }
      .stage.holding .bar i { animation: breath 1.5s ease-in-out infinite; }
      @keyframes breath { 50% { opacity: 0.45; } }

      .meta {
        width: 268px; margin-top: 12px; display: flex; justify-content: space-between;
        font-size: 11px; letter-spacing: 1px; color: #5d7c8a;
        opacity: 0; animation: fadeIn 0.6s ease 1s both;
      }
      .meta .step { display: flex; align-items: center; gap: 7px; }
      .meta .step::before {
        content: ""; width: 4px; height: 4px; border-radius: 50%;
        background: #34e5c8; box-shadow: 0 0 6px #34e5c8;
      }
      .meta .pct { color: #34e5c8; font-variant-numeric: tabular-nums; }

      .hint {
        margin-top: 26px; font-size: 10.5px; letter-spacing: 1.4px; color: #46626f;
        opacity: 0; animation: fadeIn 0.8s ease 2s both;
      }

      .tag {
        position: absolute; left: 78px; bottom: 34px;
        font-size: 10px; letter-spacing: 2px; color: #365061;
        opacity: 0; animation: fadeIn 0.8s ease 1.6s both;
      }

      /* 大窗口按比例放大主体，别让整块视觉缩在屏幕中间一小团 */
      .core { transform: scale(var(--fit, 1)); transform-origin: 50% 46%; }
      .tag b { color: #3f6577; font-weight: 600; }

      /* 结束：中心一闪，然后整个舞台淡出 */
      .bloom {
        position: fixed; inset: 0; pointer-events: none; opacity: 0;
        background: radial-gradient(circle at 50% 46%, rgba(52, 229, 200, 0.5), transparent 46%);
      }
      .bloom.on { animation: bloom 0.52s ease-out both; }
      @keyframes bloom {
        0% { opacity: 0; transform: scale(0.7); }
        35% { opacity: 1; }
        100% { opacity: 0; transform: scale(1.5); }
      }

      /* 失败态：红色替换青绿，字面直接说哪里不行 */
      .stage.fail .meta .step::before { background: #ff6b6b; box-shadow: 0 0 6px #ff6b6b; }
      .stage.fail .meta .pct { color: #ff8f8f; }
      .stage.fail .bar i { background: linear-gradient(90deg, #7a2b2b, #ff6b6b); box-shadow: none; }
      .stage.fail .brand span { color: #ffb4b4; }
      .stage.fail .radar { filter: hue-rotate(-140deg) saturate(0.75); }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="grid"></div>
      <div class="hud tl"></div><div class="hud tr"></div>
      <div class="hud bl"></div><div class="hud br"></div>

      <div class="core">
        <svg class="radar" viewBox="0 0 240 240" aria-hidden="true">
          <defs>
            <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#34e5c8" stop-opacity="0" />
              <stop offset="45%" stop-color="#34e5c8" stop-opacity="0.95" />
              <stop offset="100%" stop-color="#a9fff2" stop-opacity="0.95" />
            </linearGradient>
            <linearGradient id="sweepGrad" x1="0" y1="1" x2="1" y2="0">
              <stop offset="0%" stop-color="#34e5c8" stop-opacity="0" />
              <stop offset="100%" stop-color="#34e5c8" stop-opacity="0.34" />
            </linearGradient>
            <radialGradient id="glowGrad">
              <stop offset="0%" stop-color="#7dfff0" stop-opacity="0.55" />
              <stop offset="100%" stop-color="#7dfff0" stop-opacity="0" />
            </radialGradient>
            <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="2.4" />
            </filter>
          </defs>

          <!-- 底光与刻度环 -->
          <circle cx="120" cy="120" r="96" fill="url(#glowGrad)" opacity="0.5" />
          <circle class="rim" cx="120" cy="120" r="92" fill="none"
                  stroke="rgba(24, 68, 82, 0.9)" stroke-width="1.4" />

          <!-- 高亮弧：缓慢绕圈 -->
          <g class="arc-g">
            <circle class="arc" cx="120" cy="120" r="92" fill="none" stroke="url(#arcGrad)"
                    stroke-width="2" stroke-linecap="round"
                    stroke-dasharray="118 460" />
          </g>

          <!-- 内圈虚线，反向慢转 -->
          <g class="inner-g">
            <circle class="inner" cx="120" cy="120" r="58" fill="none"
                    stroke="rgba(52, 229, 200, 0.26)" stroke-width="1.2"
                    stroke-dasharray="3 10" stroke-linecap="round" />
          </g>

          <!-- 扫描扇形 -->
          <g class="sweep-g">
            <path d="M120 120 L120 28 A92 92 0 0 1 196.2 65.1 Z" fill="url(#sweepGrad)" />
            <line x1="120" y1="120" x2="120" y2="28" stroke="#8dfff0" stroke-width="1.5"
                  stroke-opacity="0.75" />
          </g>

          <!-- 十字准星 -->
          <g class="cross" stroke="rgba(40, 92, 108, 0.75)" stroke-width="1">
            <line x1="28" y1="120" x2="212" y2="120" />
            <line x1="120" y1="28" x2="120" y2="212" />
          </g>

          <!-- 目标光点 -->
          <g class="blip b1">
            <circle class="halo" cx="171" cy="63" r="11" fill="url(#glowGrad)" />
            <circle cx="171" cy="63" r="3.1" fill="#dbfff8" />
          </g>
          <g class="blip b2">
            <circle class="halo" cx="72" cy="158" r="8" fill="url(#glowGrad)" />
            <circle cx="72" cy="158" r="2.4" fill="#dbfff8" />
          </g>
          <g class="blip b3">
            <circle class="halo" cx="152" cy="184" r="7" fill="url(#glowGrad)" />
            <circle cx="152" cy="184" r="2.1" fill="#dbfff8" />
          </g>

          <!-- 中心：扩张脉冲 + 六边核心 -->
          <g class="pulse-g">
            <circle cx="120" cy="120" r="10" fill="none" stroke="#34e5c8" stroke-width="1" />
            <circle cx="120" cy="120" r="10" fill="none" stroke="#34e5c8" stroke-width="1" />
          </g>
          <g class="hex">
            <polygon points="120,103 134.7,111.5 134.7,128.5 120,137 105.3,128.5 105.3,111.5"
                     fill="#08161c" stroke="#34e5c8" stroke-width="1.8" />
            <circle cx="120" cy="120" r="13" fill="url(#glowGrad)" filter="url(#soft)" />
            <circle cx="120" cy="120" r="4.4" fill="#34e5c8" />
            <circle cx="120" cy="120" r="7.6" fill="none"
                    stroke="rgba(52, 229, 200, 0.45)" stroke-width="0.9" />
          </g>
        </svg>

        <div class="brand"><span>天</span><span>鉴</span><span>·</span><span>索</span><span>舆</span></div>
        <div class="sub">SUOYU RECON · 资产侦察作战台</div>

        <div class="bar"><i id="bar"></i></div>
        <div class="meta">
          <span class="step" id="step">正在校验运行环境…</span>
          <span class="pct" id="pct">0%</span>
        </div>
        <div class="hint">首次启动需建库并装载内置字典，之后直接进入作战台</div>
      </div>

      <div class="tag"><b>天鉴·索舆</b> · v<span id="ver">2.9.0</span> · BUILD 2026.11</div>
    </div>
    <div class="bloom" id="bloom"></div>

    <script>
      const TOTAL = 5000;
      const stage = document.getElementById("stage");
      const bar = document.getElementById("bar");
      const pctEl = document.getElementById("pct");
      const stepEl = document.getElementById("step");
      const started = Date.now();
      let finished = false;
      let holding = false;

      // 主视觉随窗口缩放：1180x800 为 1 倍基准，大屏放大、小窗略收
      const coreEl = document.querySelector(".core");
      const fitCore = () => {
        const k = Math.min(1.32, Math.max(0.84, Math.min(innerWidth / 1180, innerHeight / 800)));
        coreEl.style.setProperty("--fit", k.toFixed(3));
      };
      fitCore();
      addEventListener("resize", fitCore);

      // 版本号由外壳按 package.json 传进来，页面里不写死
      const ver = new URLSearchParams(location.search).get("v");
      if (ver) document.getElementById("ver").textContent = ver;

      // 进度条与百分比跑满 5 秒；之后停在 100% 等引擎，绝不倒退
      // 用定时器而不是 rAF：窗口被遮挡时 rAF 会被整体暂停，条子就停在半路；
      // 定时器最多被节流，时间到了照样补到 100%
      let timer = 0;
      const tick = () => {
        if (finished) {
          clearInterval(timer);
          timer = 0;
          return;
        }
        const t = Math.min(1, (Date.now() - started) / TOTAL);
        bar.style.width = (t * 100).toFixed(1) + "%";
        pctEl.textContent = Math.round(t * 100) + "%";
        if (t >= 1) {
          if (!holding) {
            holding = true;
            stage.classList.add("holding");
            if (stepEl.textContent === "正在校验运行环境…") {
              stepEl.textContent = "引擎预热中…";
            }
          }
          clearInterval(timer);
          timer = 0;
        }
      };
      timer = setInterval(tick, 60);
      tick();

      // 外壳通过 executeJavaScript 调到这三个函数
      window.__suoyuStep = (text) => {
        stepEl.textContent = String(text || "");
      };
      window.__suoyuFail = (text) => {
        finished = true;
        stage.classList.add("fail");
        stepEl.textContent = String(text || "启动失败");
        pctEl.textContent = "";
        bar.style.width = "100%";
      };
      window.__suoyuFinish = () => {
        if (finished) return;
        finished = true;
        document.getElementById("bloom").classList.add("on");
        // 闪一下再整体淡出，交给外壳在淡出结束时载入主界面
        setTimeout(() => stage.classList.add("out"), 130);
      };
    </script>
  </body>
</html>
