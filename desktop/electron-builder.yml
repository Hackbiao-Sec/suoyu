appId: com.tianjian.suoyu
productName: Suoyu Console
copyright: TianJian Suoyu
directories:
  output: release
  buildResources: build
files:
  - main.js
  - preload.js
  - splash.html
  - package.json
extraResources:
  - from: ../dist/suoyu-server.exe
    to: bin/suoyu-server.exe
  # 窗口 / 任务栏用的图标；main.js 从 resourcesPath 根读它
  - from: assets/icon.ico
    to: icon.ico
asar: true
npmRebuild: false
win:
  target:
    - target: portable
      arch:
        - x64
  icon: assets/icon.ico
  requestedExecutionLevel: asInvoker
portable:
  unicode: true
  artifactName: SuoyuConsole-${version}-portable.${ext}
  # 单文件运行：启动时解压到临时目录，退出后清理
  # 解压这十几秒里窗口还没起来，用品牌图占位，别让双击之后像没反应
  splashImage: assets/splash.bmp
